<div
  class="page scrollable-page"
  appInfiniteScroll
  (scrolled)="paginatePhotos()"
>
  <app-card-grid>
    @for (photo of photoList(); track photo.trackId) {
      <app-photo-card [photo]="photo" (photoClick)="makeFavorite($event)"/>
    }
  </app-card-grid>

  @if (isPaginateLoading()) {
    <app-loader />
  }
</div>
