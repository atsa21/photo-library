<header class="header">
  <nav class="nav-list">
    @for (nav of navList; track nav.label) {
      <a
        class="nav-list-item"
        matButton="outlined"
        color="secondary"
        [routerLink]="nav.path"
        [class.active]="isActive(nav)"
      >{{ nav.label }}</a>
    }
  </nav>
</header>
