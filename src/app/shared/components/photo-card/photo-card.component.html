<mat-card appearance="outlined">
  <img
    mat-card-image
    loading="lazy"
    [src]="photo().thumbUrl"
    [alt]='photo().author'
    tabindex="0"
    (load)="$event.target.classList.add('loaded')"
    (click)="photoClick.emit(photo())"
    (keydown.enter)="photoClick.emit(photo())"
  />
  @if (favorite()) {
    <mat-icon class="favorite-icon" fontIcon="favorite"></mat-icon>
  }
</mat-card>
